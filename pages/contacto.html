<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactenos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-light bg-white border-bottom sticky-top shadow-sm px-4">
    <a class="navbar-brand font-head fw-bold fs-4" href="login.html">Mi <span>Gabinete</span> Virtual</a>
  </nav>

  <div class="flex-grow-1 p-4">
    <h1 class="font-head fs-2 mb-4">Contáctenos</h1>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card border shadow-sm p-4 h-100">
          <h2 class="font-head fs-4 mb-1">Estamos aquí para ayudarte</h2>
          <p class="small text-mist mb-3">Ponte en contacto con nosotros y te atenderemos lo antes posible.</p>
          <hr>
          <div class="mb-3">
            <p class="text-uppercase fw-bold small text-clay mb-1" style="font-size:11px;letter-spacing:.8px;">Dirección
            </p>
            <p class="small mb-0">Calle 15 # 32-10, Barrio Alamos</p>
          </div>
          <div class="mb-3">
            <p class="text-uppercase fw-bold small text-clay mb-1" style="font-size:11px;letter-spacing:.8px;">Contacto
            </p>
            <div class="d-flex align-items-center gap-2 small text-mist mb-1"><i class="bi bi-envelope"></i>
              enim@bibendum.com</div>
            <div class="d-flex align-items-center gap-2 small text-mist mb-1"><i class="bi bi-telephone"></i> 999 999
              999</div>
            <div class="d-flex align-items-center gap-2 small text-mist"><i class="bi bi-phone"></i> 666 666 666</div>
          </div>
          <div>
            <p class="text-uppercase fw-bold small text-clay mb-1" style="font-size:11px;letter-spacing:.8px;">Horario
            </p>
            <p class="small mb-0">Lunes a Viernes de 9:00am a 7:00pm</p>
          </div>
        </div>
      </div>


      <div class="col-md-8">
        <div class="card border shadow-sm p-4 h-100">
          <h3 class="font-head fs-4 mb-4">Envíanos un mensaje</h3>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-uppercase text-mist">Nombre</label>
            <input type="text" class="form-control" placeholder="Escriba aquí su nombre">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-uppercase text-mist">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="Su dirección de correo">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-uppercase text-mist">Teléfono</label>
              <input type="tel" class="form-control" placeholder="Su número de teléfono">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold text-uppercase text-mist">Consulta</label>
            <textarea class="form-control" rows="5"
              placeholder="Escriba aquí su consulta. Le atenderemos lo antes posible."></textarea>
          </div>
          <button class="btn btn-clay w-100">Enviar mensaje</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
