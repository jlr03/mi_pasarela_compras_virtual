<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirección de envío</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-light bg-white border-bottom sticky-top shadow-sm px-4">
    <a class="navbar-brand font-head fw-bold fs-4" href="login.html">Mi <span>Gabinete</span> Virtual</a>
    <a href="carrito.html" class="btn btn-clay btn-sm rounded-pill">
      <i class="bi bi-cart3"></i> 125,99 $
    </a>
  </nav>
  <div class="flex-grow-1 p-4">
    <div class="d-flex align-items-center mb-4 gap-2 flex-wrap">
      <div class="d-flex align-items-center gap-2">
        <span class="badge rounded-circle bg-success d-flex align-items-center justify-content-center"
          style="width:26px;height:26px;">✓</span>
        <span class="small fw-semibold text-success">Carrito</span>
      </div>
      <div class="step-connector"></div>
      <div class="d-flex align-items-center gap-2">
        <span class="badge rounded-circle bg-clay d-flex align-items-center justify-content-center"
          style="width:26px;height:26px;">2</span>
        <span class="small fw-semibold text-clay">Dirección</span>
      </div>
      <div class="step-connector"></div>
      <div class="d-flex align-items-center gap-2">
        <span class="badge rounded-circle bg-secondary d-flex align-items-center justify-content-center"
          style="width:26px;height:26px;">3</span>
        <span class="small fw-semibold text-mist">Pago</span>
      </div>
      <div class="step-connector"></div>
      <div class="d-flex align-items-center gap-2">
        <span class="badge rounded-circle bg-secondary d-flex align-items-center justify-content-center"
          style="width:26px;height:26px;">4</span>
        <span class="small fw-semibold text-mist">Confirmación</span>
      </div>
    </div>

    <div class="row g-4 align-items-start">
      <div class="col-lg-7">
        <div class="card border shadow-sm p-4 mb-3">
          <h3 class="font-head fs-5 mb-3">Dirección de envío</h3>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-uppercase text-mist">Nombre y apellidos</label>
              <input type="text" class="form-control" placeholder="Tu nombre completo">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-uppercase text-mist">Teléfono</label>
              <input type="tel" class="form-control" placeholder="999 999 999">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-uppercase text-mist">Email</label>
            <input type="email" class="form-control" placeholder="tu@email.com">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-uppercase text-mist">Dirección</label>
            <input type="text" class="form-control" placeholder="Calle, número, piso...">
          </div>
          <div class="row g-3">
            <div class="col-3">
              <label class="form-label small fw-semibold text-uppercase text-mist">C.P.</label>
              <input type="text" class="form-control" placeholder="28001">
            </div>
            <div class="col-5">
              <label class="form-label small fw-semibold text-uppercase text-mist">Ciudad</label>
              <input type="text" class="form-control" placeholder="Madrid">
            </div>
            <div class="col-4">
              <label class="form-label small fw-semibold text-uppercase text-mist">Provincia</label>
              <input type="text" class="form-control" placeholder="Madrid">
            </div>
          </div>
          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" id="sameAddr" checked>
            <label class="form-check-label small" for="sameAddr">Usar la misma dirección para facturación</label>
          </div>
        </div>

        <div class="card border shadow-sm p-4 bg-stone mb-3">
          <h4 class="small fw-semibold text-mist mb-3">Dirección de facturación</h4>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-uppercase text-mist">Nombre y apellidos</label>
              <input type="text" class="form-control bg-white" placeholder="Tu nombre completo">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-uppercase text-mist">Teléfono</label>
              <input type="tel" class="form-control bg-white" placeholder="999 999 999">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-uppercase text-mist">Email</label>
            <input type="email" class="form-control bg-white" placeholder="tu@email.com">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-uppercase text-mist">Dirección</label>
            <input type="text" class="form-control bg-white" placeholder="Calle, número, piso...">
          </div>
          <div class="row g-3">
            <div class="col-3">
              <label class="form-label small fw-semibold text-uppercase text-mist">C.P.</label>
              <input type="text" class="form-control bg-white" placeholder="28001">
            </div>
            <div class="col-5">
              <label class="form-label small fw-semibold text-uppercase text-mist">Ciudad</label>
              <input type="text" class="form-control bg-white" placeholder="Madrid">
            </div>
            <div class="col-4">
              <label class="form-label small fw-semibold text-uppercase text-mist">Provincia</label>
              <input type="text" class="form-control bg-white" placeholder="Madrid">
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <a href="carrito.html" class="btn btn-outline-secondary">Volver</a>
          <a href="pago.html" class="btn btn-clay">Siguiente</a>
        </div>
      </div>


      <div class="col-lg-5">
        <div class="card border shadow-sm p-4 summary-sticky">
          <h3 class="font-head fs-5 mb-3">Tu pedido</h3>
          <div class="d-flex gap-3 align-items-center pb-3 border-bottom mb-3">
            <div class="cart-thumb flex-shrink-0"></div>
            <div>
              <div class="fw-semibold small">Jersey Lana Premium</div>
              <div class="small text-mist">Talla S · Azul marino</div>
            </div>
          </div>
          <div class="d-flex gap-3 align-items-center mb-3">
            <div class="cart-thumb flex-shrink-0" style="background:linear-gradient(135deg,var(--stone),#D5CFC6);">
            </div>
            <div>
              <div class="fw-semibold small">Camisa Oxford</div>
              <div class="small text-mist">Talla M · Blanco × 2</div>
            </div>
          </div>
          <hr>
          <div class="d-flex justify-content-between small mb-1"><span>Subtotal</span><span>121,00 $</span></div>
          <div class="d-flex justify-content-between small mb-1"><span>Descuento</span><span class="text-success">−0,00
              $</span></div>
          <div class="d-flex justify-content-between small mb-1"><span>Envío</span><span>4,99 $</span></div>
          <div class="d-flex justify-content-between small mb-1"><span>IVA</span><span>26,25 $</span></div>
          <hr>
          <div class="d-flex justify-content-between fw-bold"><span>Total</span><span class="text-clay fs-5">125,99
              $</span></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
